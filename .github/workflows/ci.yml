name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build site and PDF (fails above 2 pages)
        run: npm run build

      - name: Playwright tests (desktop, iPhone 13, Pixel 7)
        run: npx playwright test --update-snapshots=missing

      - name: Private leak check
        env:
          PRIVATE_REPOS: ${{ secrets.PRIVATE_REPOS }}
        run: npm run leak-check

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            --exclude '^https://mickosis\.github\.io'
            --max-retries 3
            --no-progress
            'dist/**/*.html'
          fail: true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

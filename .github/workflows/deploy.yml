name: Build, test and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC: refresh GitHub stats and redeploy
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Linux visual baselines (after an intentional design change)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Refresh GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
          PRIVATE_REPOS: ${{ secrets.PRIVATE_REPOS }}
        run: npm run fetch:github

      - name: Update README stats
        run: npx tsx scripts/update-readme.ts

      - name: Build site and PDF (fails above 2 pages)
        run: npm run build

      - name: Playwright tests (desktop, iPhone 13, Pixel 7)
        run: npx playwright test --update-snapshots=${{ inputs.update_snapshots && 'all' || 'missing' }}

      - name: Private leak check
        env:
          PRIVATE_REPOS: ${{ secrets.PRIVATE_REPOS }}
        run: npm run leak-check

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            --exclude '^https://mickosis\.github\.io'
            --max-retries 3
            --no-progress
            'dist/**/*.html'
          fail: true

      - name: Write build info
        run: npm run build:info

      - name: Commit refreshed data and new baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/__screenshots__/linux
          # Data and README are committed by the weekly/manual runs; pushes only deploy them.
          if [ '${{ github.event_name }}' != 'push' ]; then git add data/github.json README.md; fi
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'chore: refresh GitHub stats and generated files'
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

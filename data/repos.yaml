# Which repositories the site shows and how.
#
# Public repos: everything owned, non-fork and not excluded is listed automatically,
# sorted by latest push. "featured" pins repos to the top with a hand-written blurb.
#
# Private repos: NEVER listed here by name. Each masked card has a public alias only.
# The alias -> real repo mapping lives in the PRIVATE_REPOS secret
# (format: "alias=RepoA+RepoB;alias2=RepoC") and is read by scripts/fetch-github.ts.
owner: Mickosis
# Commit author names that count as the owner (commits not linked to the GitHub account).
identities: [Mico Rigunay]

featured:
  - repo: insta_sync_mac
    title: Insta Sync for Mac
    blurb: >-
      Native Swift macOS app that sets Mac Contacts photos from Instagram
      profile pictures and syncs them to iPhone through iCloud. Matches contacts
      to followed accounts, backs up each contact before changing it, and has
      golden tests.
  - repo: mktmxxng
    title: MKTMXXNG
    blurb: >-
      Installable React and TypeScript PWA for a shared list of Makati cafes, on
      Firebase Auth and Firestore. Rolls a random pick and logs visits. CI runs
      lint, unit and security-rules tests, and a failed check blocks the deploy.
  - repo: ig-carousel
    title: IG Carousel Splitter
    blurb: >-
      Browser-only tool that splits panoramas into 1080×1440 Instagram carousel
      slides as 1:1 pixel copies in lossless PNG. Rejects wrong sizes instead of
      resizing, and images never leave the device.
  - repo: Modern_Emerald
    title: Pokémon Modern Emerald
    blurb: >-
      Enhanced Pokémon Emerald ROM hack in C with follower Pokémon, custom surf
      sprites, overworld wild encounters and quality-of-life fixes. Builds and
      releases through GitHub Actions; developed with coding agents.
  - repo: lrn2play
    title: lrn2play
    blurb: >-
      Open-source pixel bot in AutoIt that drives game input from screen pattern
      recognition. My most-starred repo and my first real automation project.
  - repo: shopifyshopper
    title: Shopify Shopper
    blurb: >-
      Python bot that watches Shopify stores for restocks, sends alerts
      through Discord webhooks and Twilio, and checks out automatically with
      Selenium. Ran on AWS for round-the-clock monitoring.
  - repo: JSPlaywrightFramework
    title: Playwright framework (JavaScript)
    blurb: >-
      Page Object Model test framework on Playwright with Allure reporting,
      storage-state auth reuse and visual screenshots.
  - repo: PythonSelFramework
    title: Selenium framework (Python)
    blurb: >-
      Page Object Model framework on Selenium and pytest with data-driven tests,
      shared utilities and HTML reports.

exclude:
  - mickosis.github.io

masked:
  - alias: game-server
    title: Online game server platform
    stack: [C, C++, Python, PHP]
    blurb: >-
      Large C and C++ server codebase with a web control panel, a client data
      pipeline with validation tooling, and automated upstream merges. In
      production. One maintainer working with coding agents under an AGENTS.md
      contract.
  - alias: anti-cheat
    title: Game client anti-cheat
    stack: [C, Shell, Python]
    blurb: >-
      Encrypted client transport, hardware-bound session limits, liveness
      challenges and behavioral detection, now live with automated key
      rotation. CI runs sanitizers and fuzz tests. Built by an autonomous agent
      against a roadmap of pass/fail gates.
  - alias: drum-assistant
    title: AI-assisted drum MIDI plugin
    stack: [C++, Python]
    blurb: >-
      Audio plugin (AU, VST3 and standalone) for macOS, with a Windows beta.
      Small neural models turn programmed drum MIDI into playable, human-feeling
      parts. Spec-first and agent-driven.
  - alias: follower-audit
    title: Privacy-first follower audit
    stack: [HTML, JavaScript]
    blurb: >-
      Browser-only tool that merges social follower exports, charts
      follow-backs and lets you triage non-mutual follows one by one.
      No data leaves the device.

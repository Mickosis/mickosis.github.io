work:
  - name: EROAD
    position: QA Chapter Lead
    location: Pasig, Philippines (Hybrid)
    startDate: 2025-11
    summary: Leads the Manila QA Chapter and the Test Automation Foundations team.
    highlights:
      - Lead the Manila QA Chapter and a team of 5 QA engineers.
      - Product Owner for the Test Automation Foundations team.
      - Built a Java + Appium mobile automation framework, cutting testing time from a month to a week.
      - Drive AI adoption (cmux, GitHub Copilot), build MCP servers for Insomnia and TestRail, and contribute to internal telematics tooling.
  - name: EROAD
    position: Software QA Engineer
    location: Auckland, New Zealand (Remote)
    startDate: 2023-11
    endDate: 2025-11
    summary: Automation test analyst for the In-Cab Experience team.
    highlights:
      - Led the In-Cab Automation Initiative, designing a WebdriverIO + Appium suite in TypeScript that runs locally and in the cloud on LambdaTest.
      - Set up the suite's GitHub repository with automated quality checks through GitHub Actions.
      - Revamped the manual QA process with test case writing and execution standards in TestRail, raising consistency and coverage.
      - Built and maintained shared automated test scripts in Java with Appium and Selenium.
  - name: Circular Economy Systems (CES)
    position: Automation Tester
    location: Sydney, Australia (Remote)
    startDate: 2022-07
    endDate: 2023-10
    summary: Lead QA engineer for the Platform squad.
    highlights:
      - Automated tests with Testsigma and Postman, reaching up to 80% code coverage.
      - Cut team regression time from 7 days to 4 hours.
      - Worked with product owners and business analysts to roll changes out across squads.
      - Ran scrum ceremonies as secondary Scrum Master.
  - name: Accenture
    position: Test Engineering Team Lead
    location: Quezon City, Philippines (Remote)
    startDate: 2021-09
    endDate: 2022-07
    summary: QA lead for Qantas Airways mobile apps, Travel Experience squad.
    highlights:
      - Led a team of 3 QA engineers as Lead Implementation Engineer for the Qantas Travel Experience squad.
      - Managed release testing across squads, cutting spillover tasks by 90%.
      - Ran manual and automated tests for iOS and Android front ends against a shared backend.
      - Drove sprint progress as Scrum Master.
  - name: Oracle NetSuite
    position: Software Engineer in Test
    location: Makati, Philippines
    startDate: 2020-03
    endDate: 2021-08
    summary: SDET for Infrastructure Product Services.
    highlights:
      - Designed test plans and automation scenarios for Infrastructure Product Services.
      - Cut regression from 2 days to 6 hours through automation.
      - Documented QA processes so new hires could start testing within 7 days.
      - Built Java and JavaScript test libraries on Selenium WebDriver.
  - name: Navitaire, an Amadeus company
    position: Senior Software QA Analyst
    location: Taguig, Philippines
    startDate: 2015-06
    endDate: 2020-03
    summary: Senior QA engineer and subject matter expert for Navitaire Loyalty.
    highlights:
      - Built automated desktop and API tests that cut total testing time by 90%.
      - Trained and led up to 4 engineers as Test Automation Lead.
      - Maintained C# test libraries integrated into CI/CD.
      - Served as subject matter expert for Navitaire Loyalty estimates and planning.

